name: Release OmniPDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Manual runs start from a branch, so the tag is supplied by the input;
      # tag pushes keep using the tag that triggered the run.
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm run selftest

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Build unsigned installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify updater assets
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          test -s "dist/OmniPDF-Setup-${version}.exe"
          test -s "dist/OmniPDF-Setup-${version}.exe.blockmap"
          test -s "dist/latest.yml"
          grep -q "^version: ${version}$" dist/latest.yml
          grep -q "url: OmniPDF-Setup-${version}.exe" dist/latest.yml

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "dist/OmniPDF-Setup-${version}.exe"
            "dist/OmniPDF-Setup-${version}.exe.blockmap"
            "dist/latest.yml"
          )
          # Re-tagging an already-published version must not fail the run, and a
          # published release's bytes are immutable: fill in missing assets and
          # never overwrite the verified installer, blockmap or feed.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" = "true" ]; then
              echo "Release $RELEASE_TAG is a draft; completing it before publishing."
            else
              echo "Release $RELEASE_TAG already exists; verifying assets."
            fi
            present="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if grep -Fxq "$name" <<<"$present"; then
                echo "asset-present $name"
              else
                echo "asset-missing $name; uploading"
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
            # An unfinished draft would exit 0 while the feed still points at the
            # previous version, so publish it instead of treating it as done.
            if [ "$is_draft" = "true" ]; then
              gh release edit "$RELEASE_TAG" --draft=false --title "OmniPDF $version"
              echo "release-published $RELEASE_TAG (draft completed)"
            else
              gh release edit "$RELEASE_TAG" --title "OmniPDF $version"
              echo "release-ready $RELEASE_TAG (existing)"
            fi
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --title "OmniPDF $version" \
            --generate-notes \
            "${assets[@]}"
