name: Release OmniPDF

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm run selftest

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Build unsigned installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify updater assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s "dist/OmniPDF-Setup-${version}.exe"
          test -s "dist/OmniPDF-Setup-${version}.exe.blockmap"
          test -s "dist/latest.yml"
          grep -q "^version: ${version}$" dist/latest.yml
          grep -q "url: OmniPDF-Setup-${version}.exe" dist/latest.yml

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "OmniPDF $version" \
            --generate-notes \
            "dist/OmniPDF-Setup-${version}.exe" \
            "dist/OmniPDF-Setup-${version}.exe.blockmap" \
            "dist/latest.yml"
