name: Release OmniPDF

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm run selftest

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Build unsigned installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify updater assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -s "dist/OmniPDF-Setup-${version}.exe"
          test -s "dist/OmniPDF-Setup-${version}.exe.blockmap"
          test -s "dist/latest.yml"
          grep -q "^version: ${version}$" dist/latest.yml
          grep -q "url: OmniPDF-Setup-${version}.exe" dist/latest.yml

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "dist/OmniPDF-Setup-${version}.exe"
            "dist/OmniPDF-Setup-${version}.exe.blockmap"
            "dist/latest.yml"
          )
          # Re-tagging an already-published version must not fail the run, and a
          # published release's bytes are immutable: fill in missing assets and
          # never overwrite the verified installer, blockmap or feed.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" = "true" ]; then
              echo "Release $GITHUB_REF_NAME is a draft; completing it before publishing."
            else
              echo "Release $GITHUB_REF_NAME already exists; verifying assets."
            fi
            present="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if grep -Fxq "$name" <<<"$present"; then
                echo "asset-present $name"
              else
                echo "asset-missing $name; uploading"
                gh release upload "$GITHUB_REF_NAME" "$asset"
              fi
            done
            # An unfinished draft would exit 0 while the feed still points at the
            # previous version, so publish it instead of treating it as done.
            if [ "$is_draft" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false --title "OmniPDF $version"
              echo "release-published $GITHUB_REF_NAME (draft completed)"
            else
              gh release edit "$GITHUB_REF_NAME" --title "OmniPDF $version"
              echo "release-ready $GITHUB_REF_NAME (existing)"
            fi
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "OmniPDF $version" \
            --generate-notes \
            "${assets[@]}"
